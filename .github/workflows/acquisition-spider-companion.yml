name: Spider OSS companion fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/fixtures/spider_companion/**'
      - '.github/workflows/acquisition-spider-companion.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: cli, crate: spider_cli, version: '2.54.2', binary: spider }
          - { mode: mcp, crate: spider_mcp, version: '2.53.9', binary: spider-mcp }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build exact upstream package without default cloud features
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
        run: cargo install --debug --locked --no-default-features --version "=$VERSION" --root "$RUNNER_TEMP/spider-bin" "$CRATE"
      - name: Execute local fixture only, drop privileges after network setup
        env:
          MODE: ${{ matrix.mode }}
          BIN_NAME: ${{ matrix.binary }}
        run: |
          sudo unshare --net -- bash -eu -c 'ip link set lo up; exec setpriv --reuid "$1" --regid "$2" --clear-groups python3 "$3" "$4" "$5"' _ "$(id -u)" "$(id -g)" "$GITHUB_WORKSPACE/ci/fixtures/spider_companion/fixture.py" "$MODE" "$RUNNER_TEMP/spider-bin/bin/$BIN_NAME"
