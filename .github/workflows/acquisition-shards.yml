name: Acquisition sharded fixture
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/acquisition_shards.py'
      - 'ci/fixtures/acquisition_sharded.py'
      - 'tests/test_acquisition_shards.py'
      - '.github/workflows/acquisition-shards.yml'
permissions:
  contents: read
jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        id: [0,1,2,3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m ci.fixtures.acquisition_sharded worker "$RUNNER_TEMP/shard-${{ matrix.id }}.json" --shard "${{ matrix.id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acquisition-shard-${{ matrix.id }}
          path: ${{ runner.temp }}/shard-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 1
  combine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: shard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: acquisition-shard-*
          path: ${{ runner.temp }}/acquisition-shards
          merge-multiple: true
      - run: python3 -m ci.fixtures.acquisition_sharded aggregate "$RUNNER_TEMP/acquisition-shards"
