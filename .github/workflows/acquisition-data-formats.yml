name: Acquisition data format fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/acquisition_data_formats.py'
      - 'ci/fixtures/acquisition_data_formats/**'
      - '.github/workflows/acquisition-data-formats.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed direct pins
        run: python -m pip install --disable-pip-version-check --no-input -r ci/fixtures/acquisition_data_formats/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s ci/fixtures/acquisition_data_formats -v
      - run: python -m pip freeze
