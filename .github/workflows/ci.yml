name: ZEIBAEL - Modular Public CI
run-name: "ZEIBAEL CI / ${{ inputs.task }} / ${{ inputs.script_id }} / #${{ github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Approved public software job type"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - python_tests
          - node_tests
          - package
          - script
      script_id:
        description: "Reviewed ci/jobs/<script_id>.json, .py or .sh; task=script only"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'zeibaelsystem' }}
    name: Validate trusted job and build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      job_count: ${{ steps.plan.outputs.job_count }}
      job_ids: ${{ steps.plan.outputs.job_ids }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
          persist-credentials: false

      - name: Validate committed manifest
        id: plan
        shell: bash
        env:
          ZEIBAEL_CI_ROOT: ${{ github.workspace }}/runner
          ZEIBAEL_CI_TASK: ${{ inputs.task }}
          ZEIBAEL_SCRIPT_ID: ${{ inputs.script_id }}
        run: python3 runner/scripts/job_plan.py

  execute:
    name: ${{ matrix.id }} / ${{ matrix.runtime }} / ${{ matrix.runner }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout reviewed public jobs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
          persist-credentials: false

      - name: Setup driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Setup Node runtime
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup Go runtime
        if: ${{ matrix.runtime == 'go' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Setup Java runtime
        if: ${{ matrix.runtime == 'java' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust runtime
        if: ${{ matrix.runtime == 'rust' }}
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check Docker runtime
        if: ${{ matrix.runtime == 'docker' }}
        shell: bash
        run: docker version

      - name: Run reviewed software job
        id: run
        continue-on-error: true
        shell: bash
        env:
          ZEIBAEL_CI_ROOT: ${{ github.workspace }}/runner
          ZEIBAEL_CI_TASK: ${{ inputs.task }}
          ZEIBAEL_SCRIPT_ID: ${{ inputs.script_id }}
          ZEIBAEL_CI_OUTPUT: ${{ runner.temp }}/zeibael-ci-output
          ZEIBAEL_JOB_ID: ${{ matrix.id }}
          ZEIBAEL_JOB_RUNTIME: ${{ matrix.runtime }}
          ZEIBAEL_JOB_TIMEOUT: ${{ matrix.timeout }}
        run: python runner/scripts/ci_driver.py

      - name: Upload structured job report
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zeibael-report-${{ matrix.id }}
          path: ${{ runner.temp }}/zeibael-ci-output/result.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload opted-in public job outputs
        if: ${{ matrix.output_files == true && steps.run.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zeibael-output-${{ matrix.id }}
          path: ${{ runner.temp }}/zeibael-ci-output/files/
          if-no-files-found: error
          retention-days: 1

      - name: Upload public package when requested
        if: ${{ inputs.task == 'package' && steps.run.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zeibael-public-source
          path: ${{ runner.temp }}/zeibael-ci-output/zeibael-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Fail on software job error
        if: ${{ always() && steps.run.outcome == 'failure' }}
        shell: bash
        run: exit 1

  results:
    name: Aggregate machine-readable results
    needs: [plan, execute]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reporter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
          persist-credentials: false

      - name: Download per-job JSON reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: zeibael-report-*
          path: reports
        continue-on-error: true

      - name: Aggregate per-job JSON
        id: aggregate
        continue-on-error: true
        env:
          ZEIBAEL_REPORT_DIR: reports
          ZEIBAEL_SUMMARY_DIR: ${{ runner.temp }}/zeibael-results
          ZEIBAEL_EXPECTED_JOBS: ${{ needs.plan.outputs.job_count }}
          ZEIBAEL_EXPECTED_JOB_IDS: ${{ needs.plan.outputs.job_ids }}
        run: python3 runner/scripts/aggregate_results.py

      - name: Publish aggregate JSON
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zeibael-results-${{ github.run_id }}
          path: ${{ runner.temp }}/zeibael-results/aggregate.json
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when aggregate failed
        if: ${{ always() && steps.aggregate.outcome == 'failure' }}
        run: exit 1
