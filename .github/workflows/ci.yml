name: ZEIBAEL - Modular Public CI

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Software development task to run"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - python_tests
          - node_tests
          - package
          - script
      script_id:
        description: "For task=script: ci/jobs/<script_id>.py or .sh"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: zeibael-public-ci
  cancel-in-progress: false

jobs:
  ci:
    name: Public CI - ${{ inputs.task }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'zeibaelsystem' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout public project
        uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false

      - name: Run modular software validation, tests or package
        id: execute
        continue-on-error: true
        shell: bash
        env:
          ZEIBAEL_CI_TASK: ${{ inputs.task }}
          ZEIBAEL_SCRIPT_ID: ${{ inputs.script_id }}
          ZEIBAEL_CI_OUTPUT: ${{ runner.temp }}/zeibael-ci-output
        run: |
          set -euo pipefail
          umask 077
          export ZEIBAEL_CI_ROOT="$GITHUB_WORKSPACE/runner"
          python3 runner/scripts/ci_driver.py

      - name: Publish public package for one day
        if: ${{ inputs.task == 'package' && steps.execute.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: zeibael-public-ci-zip
          path: ${{ runner.temp }}/zeibael-ci-output/zeibael-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Mark failed CI jobs
        if: ${{ always() && steps.execute.outcome == 'failure' }}
        shell: bash
        run: exit 1
