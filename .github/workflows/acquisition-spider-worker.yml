name: Spider Worker isolated fixture
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/fixtures/spider_worker/**'
      - '.github/workflows/acquisition-spider-worker.yml'
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cargo install --debug --locked --no-default-features --features scrape --version '=2.54.2' --root "$RUNNER_TEMP/spider-worker" spider_worker
      - run: |
          sudo unshare --net -- bash -eu -c 'ip link set lo up; exec setpriv --reuid "$1" --regid "$2" --clear-groups python3 "$3" "$4"' _ "$(id -u)" "$(id -g)" "$GITHUB_WORKSPACE/ci/fixtures/spider_worker/fixture.py" "$RUNNER_TEMP/spider-worker/bin/spider_worker"
