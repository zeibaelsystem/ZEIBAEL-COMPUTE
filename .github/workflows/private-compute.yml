name: ZEIBAEL - Ephemeral Private Compute

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Private registry JSON dataset (allowlisted, never published)"
        required: true
        type: choice
        default: manifest
        options:
          - manifest
          - plugins
          - capabilities
          - skills
          - tools
      issued_at:
        description: "Hatchable authorization timestamp"
        required: true
        type: string
      nonce:
        description: "Hatchable authorization nonce"
        required: true
        type: string
      signature:
        description: "Hatchable authorization HMAC"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zeibael-ephemeral-private-compute
  cancel-in-progress: false

jobs:
  inspect:
    name: Process private data in temporary runner workspace
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'zeibaelsystem' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public runner code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Hatchable dispatcher authorization
        shell: bash
        env:
          ZEIBAEL_DISPATCH_SIGNING_KEY: ${{ secrets.ZEIBAEL_DISPATCH_SIGNING_KEY }}
          ZEIBAEL_DATASET: ${{ inputs.dataset }}
          ZEIBAEL_ISSUED_AT: ${{ inputs.issued_at }}
          ZEIBAEL_NONCE: ${{ inputs.nonce }}
          ZEIBAEL_SIGNATURE: ${{ inputs.signature }}
        run: |
          set -euo pipefail
          python3 scripts/verify_dispatch.py

      - name: Validate private JSON and save result back to private GitHub
        shell: bash
        env:
          ZEIBAEL_PRIVATE_REPO_PAT: ${{ secrets.ZEIBAEL_PRIVATE_REPO_PAT }}
          ZEIBAEL_DATASET: ${{ inputs.dataset }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/private_data_compute.py
