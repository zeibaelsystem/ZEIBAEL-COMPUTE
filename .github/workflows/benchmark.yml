name: ZEIBAEL - Build Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeibael-build-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'zeibaelsystem' }}
    name: Benchmark packaging performance
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Bounded software packaging benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import platform
          import tempfile
          import time
          import zipfile

          FILE_COUNT = 300
          CONTENT = (b"# ZEIBAEL skill packaging test\n" * 128)

          with tempfile.TemporaryDirectory(prefix="zeibael-bench-") as temp:
              root = Path(temp)
              source = root / "source"
              source.mkdir()
              start = time.perf_counter()
              for index in range(FILE_COUNT):
                  (source / f"file_{index:04d}.md").write_bytes(CONTENT)
              create_seconds = time.perf_counter() - start

              archive = root / "test-build.zip"
              start = time.perf_counter()
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as out:
                  for file in sorted(source.iterdir()):
                      out.write(file, arcname=file.name)
              zip_seconds = time.perf_counter() - start

              start = time.perf_counter()
              with zipfile.ZipFile(archive) as result:
                  assert result.testzip() is None, "Corrupt package"
                  assert len(result.namelist()) == FILE_COUNT, "Missing packaged files"
              verify_seconds = time.perf_counter() - start

              checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
              size = archive.stat().st_size
              print(f"Python: {platform.python_version()}")
              print(f"CPU logical count: {os.cpu_count()}")
              print(f"Generated files: {FILE_COUNT}")
              print(f"Package bytes: {size}")
              print(f"Generation seconds: {create_seconds:.6f}")
              print(f"ZIP seconds: {zip_seconds:.6f}")
              print(f"Validation seconds: {verify_seconds:.6f}")
              print(f"SHA256: {checksum}")

              summary = os.environ["GITHUB_STEP_SUMMARY"]
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### ZEIBAEL software packaging benchmark\n\n")
                  f.write(f"- Runner: \`{platform.platform()}\`\n")
                  f.write(f"- Logical CPU count: \`{os.cpu_count()}\`\n")
                  f.write(f"- Generated files: \`{FILE_COUNT}\`\n")
                  f.write(f"- Package size: \`{size}\` bytes\n")
                  f.write(f"- Create time: \`{create_seconds:.6f}\` s\n")
                  f.write(f"- ZIP time: \`{zip_seconds:.6f}\` s\n")
                  f.write(f"- Verify time: \`{verify_seconds:.6f}\` s\n")
                  f.write("\nThis is a bounded build-tool benchmark, not a general-purpose compute service.\n")
          PY
