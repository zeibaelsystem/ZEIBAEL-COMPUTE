name: Acquisition live owned fixture
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/fixtures/acquisition_live_smoke.py'
      - '.github/workflows/acquisition-live-smoke.yml'
permissions:
  contents: read
jobs:
  owned:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded live smoke against owned public files
        run: python -m ci.fixtures.acquisition_live_smoke
