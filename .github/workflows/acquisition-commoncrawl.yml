name: Acquisition Common Crawl range
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/acquisition_commoncrawl.py'
      - 'ci/fixtures/acquisition_commoncrawl_smoke.py'
      - 'tests/test_acquisition_commoncrawl.py'
      - '.github/workflows/acquisition-commoncrawl.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input warcio==1.8.2
      - run: python -m unittest discover -s tests -p test_acquisition_commoncrawl.py -v
      - run: python -m ci.fixtures.acquisition_commoncrawl_smoke
