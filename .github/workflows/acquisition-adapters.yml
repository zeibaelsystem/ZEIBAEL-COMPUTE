name: Acquisition adapter fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/acquisition_adapters.py'
      - 'ci/fixtures/acquisition_adapters/**'
      - '.github/workflows/acquisition-adapters.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned adapter test packages from public PyPI
        run: python -m pip install --disable-pip-version-check --no-input -r ci/fixtures/acquisition_adapters/requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run offline fixtures
        run: python -m unittest discover -s ci/fixtures/acquisition_adapters -v
      - name: Record installed package versions
        run: python -m pip freeze
