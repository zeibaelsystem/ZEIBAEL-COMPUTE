name: Acquisition crawler comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/fixtures/acquisition_crawlers/**'
      - '.github/workflows/acquisition-crawlers.yml'
permissions:
  contents: read
jobs:
  scrapy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input Scrapy==2.20.0
      - run: |
          sudo unshare --net -- bash -eu -c 'ip link set lo up; exec setpriv --reuid "$1" --regid "$2" --clear-groups env -i HOME="$3" PATH="/usr/bin:/bin" "$4" "$5" scrapy' _ "$(id -u)" "$(id -g)" "$RUNNER_TEMP" "$(command -v python)" "$GITHUB_WORKSPACE/ci/fixtures/acquisition_crawlers/fixture.py"
  crawlee:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: npm --prefix ci/fixtures/acquisition_crawlers install --no-save --no-audit --no-fund --ignore-scripts crawlee@3.18.2
      - run: |
          sudo unshare --net -- bash -eu -c 'ip link set lo up; exec setpriv --reuid "$1" --regid "$2" --clear-groups env -i HOME="$3" PATH="/usr/bin:/bin" "$4" "$5"' _ "$(id -u)" "$(id -g)" "$RUNNER_TEMP" "$(command -v node)" "$GITHUB_WORKSPACE/ci/fixtures/acquisition_crawlers/crawlee.mjs"
  crawl4ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-input Crawl4AI==0.9.5
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers" python -m playwright install --with-deps chromium
      - run: |
          sudo unshare --net -- bash -eu -c 'ip link set lo up; exec setpriv --reuid "$1" --regid "$2" --clear-groups env -i HOME="$3" PATH="/usr/bin:/bin" PLAYWRIGHT_BROWSERS_PATH="$3/browsers" "$4" "$5" crawl4ai' _ "$(id -u)" "$(id -g)" "$RUNNER_TEMP" "$(command -v python)" "$GITHUB_WORKSPACE/ci/fixtures/acquisition_crawlers/fixture.py"
