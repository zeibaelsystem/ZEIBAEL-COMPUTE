name: Acquisition stream protocol fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/acquisition_streams.py'
      - 'ci/fixtures/acquisition_streams/**'
      - '.github/workflows/acquisition-streams.yml'
permissions:
  contents: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          python -m pip install --disable-pip-version-check --no-input paho-mqtt==2.2.0 asyncua==2.1.0 websockets==17.4
          python -m pip check
      - run: |
          sudo unshare --net -- bash -eu -c 'ip link set lo up; exec setpriv --reuid "$1" --regid "$2" --clear-groups env -i HOME="$3" PATH="/usr/sbin:/usr/bin:/bin" "$4" -m unittest discover -s ci/fixtures/acquisition_streams -v' _ "$(id -u)" "$(id -g)" "$RUNNER_TEMP" "$(command -v python)"
